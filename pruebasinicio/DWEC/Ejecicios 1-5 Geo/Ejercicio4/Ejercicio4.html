<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4: Web Storage API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 450px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        #btn-enviar {
            background-color: #555;
            color: white;
        }

        #btn-enviar:hover {
            background-color: #333;
        }

        #btn-guardar-edad {
            background-color: #00796b;
            color: white;
        }

        #btn-guardar-edad:hover {
            background-color: #004d40;
        }

        #btn-consultar {
            background-color: #5f7c8a;
            color: white;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
        }

        #btn-consultar:hover {
            background-color: #455a64;
        }

        .consult-section {
            margin-top: 2rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            text-align: left;
        }

        .consult-section p {
            margin-bottom: 0.5rem;
        }

        #mensaje {
            margin-top: 1rem;
            font-weight: bold;
            min-height: 1.5em;
        }

        #lista-usuarios {
            margin-top: 1rem;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 4px;
            background-color: #fafafa;
        }

        .user-item {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Acceso y edad</h1>
        <p>En esta web se queda registrado el acceso de los usuarios y su edad. Puedes añadir nuevos usuarios y también
            puedes consultar los usuarios ya inscritos con su correspondiente edad.</p>

        <div class="input-group">
            <label for="nombre">Introduce tu nombre:</label>
            <input type="text" id="nombre" placeholder="Nombre">
            <button id="btn-enviar">Enviar</button>
        </div>

        <div id="age-input-container" class="input-group hidden">
            <label for="edad">Introduce tu edad:</label>
            <input type="number" id="edad" placeholder="Edad">
            <button id="btn-guardar-edad">Guardar</button>
        </div>

        <div id="mensaje"></div>

        <div class="consult-section">
            <p>Puedes consultar quién se ha registrado en esta Web:</p>
            <button id="btn-consultar">Consultar</button>
            <div id="lista-usuarios" class="hidden"></div>
        </div>
    </div>

    <script src="Ejercicio4.js"></script>
</body>

</html>
