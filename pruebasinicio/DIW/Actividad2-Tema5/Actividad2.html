<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseño Adaptativo - Transición Verde/ Azul</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #fffbe6;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .block {
      border-radius: 6px;
      min-height: 80px;
    }

    .yellow { background-color: #ffd700; }
    .blue { background-color: #4169e1; }
    .orange { background-color: #ff8c00; }
    .green { background-color: #32cd32; }

    /* --- Fila central: verde y azul --- */
    .middle {
      display: flex;
      gap: 10px;
    }

    .middle .green {
      flex: 1;
    }

    .middle .blue {
      flex: 2;
    }
    @media (max-width: 700px) {
      .middle {
        flex-direction: column; /* Verde pasa arriba del azul */
      }

      .middle .green,
      .middle .blue {
        flex: none;
        width: 100%;
        min-height: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Fila 1: Amarillo -->
    <div class="block yellow"></div>

    <!-- Fila 2: Verde + Azul -->
    <div class="middle">
      <div class="block green"></div>
      <div class="block blue"></div>
    </div>

    <!-- Fila 3: Naranja -->
    <div class="block orange"></div>
  </div>
</body>
</html>
