<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Ajedrez</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .letras {
            display: grid;
            grid-template-columns: 30px repeat(8, 50px);
            width: 430px;
            margin-bottom: 2px;
        }

        .letra {
            text-align: center;
            font-weight: bold;
            line-height: 50px;
        }

        .numeros-tablero {
            display: flex;
            flex-direction: row;         
        }

        .numeros {
            display: grid;
            grid-template-rows: repeat(8, 50px);
            margin-right: 2px;
        }

        .numero {
            text-align: center;
            font-weight: bold;
            line-height: 50px;
            width: 30px;
        }

        .tablero {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            gap: 0;
            width: 400px;
            height: 400px;
        }

        .casilla {
            width: 50px;
            height: 50px;
        }

        .blanca {
            background: #ffffff;
        }

        .negra {
            background: #000000;
        }
        .color_fondo {
            background-color: #d8b17f;
        }
        #volteo {
            transform: scaleY(-1);
        }
        #volteo2 {
            transform: scaleY(-1);
        }
    </style>
</head>
