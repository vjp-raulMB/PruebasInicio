<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biografía Personal</title>
    <style>
        /* Mobile First: diseño base para móviles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.6;
            background-color: #ffec41;
            color: #333;
        }

        .header,
        .footer {
            text-align: center;
            padding: 1rem;
            background-color: #d40000;
            color: black;
            
        }
        .footer {
            position: sticky;
            bottom: 0;
            width: 100%;
            height: 40px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
        }

        section {
            background-color: rgb(255, 255, 255);
            padding: 1rem;
            border-radius: 8px;
        }

        .bio-photo img {
            width: 100%;
            border-radius: 8px;
        }
        #nombre {
            text-align: center;
        }
        /* Punto de ruptura 1: tablets (min-width: 600px) */
        @media (min-width: 600px) {
            .container {
                gap: 1.5rem;
            }

            .bio-photo img {
                width: 80%;
                margin: 0 auto;
                display: block;
            }
        }
        img {
            max-width: 80%;
            max-height: 80%;
        }
        /* Punto de ruptura 2: pantallas medianas (min-width: 768px) */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }

            section {
                flex: 0 0 48%;
            }
        }

        /* Punto de ruptura 3: pantallas grandes (min-width: 1024px) */
        @media (min-width: 1024px) {
            .container {
                gap: 2rem;
            }

            section {
                flex: 0 0 30%;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>Mi Biografía</h1>
    </header>

    <main class="container">
        <!-- Fotografía -->
        <section class="bio-photo">
            <img src="img/toro.png" alt="Mi fotografía">
            <h2 id="nombre">Raúl Martín Bote</h2>
        </section>

        <!-- Aficiones -->
        <section class="bio-hobbies">
            <h2>Aficiones</h2>
            <p>Torear</p>
            <img src="img/toreo.jpg" alt="Aficion">
        </section>

        <!-- Música favorita -->
        <section class="bio-music">
            <h2>Música Favorita</h2>
            <p>Manolo Escobar</p>
            <img src="img/manolo.jpg" alt="Manolo">
        </section>

        <!-- Cine favorito -->
        <section class="bio-movie">
            <h2>Baile favorito</h2>
            <p>Flamenco</p>
            <img src="img/flamenco.jpg" alt="">
        </section>
    </main>

    <footer class="footer">
        <p>© 2025 Mi Biografía</p>
    </footer>
</body>

</html>
