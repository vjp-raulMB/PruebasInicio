<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fichas de Dominó</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            height: 100vh;
            margin: 0;
        }

        .tile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 180px;
            height: 360px;
            background: #fff;
            border: 3px solid #000;
            border-radius: 16px;
            position: relative;
            box-sizing: border-box;
            padding: 10px;
        }

        .half {
            position: relative;
            width: 100%;
            height: 50%;
        }

        .pip {
            width: 24px;
            height: 24px;
            background: #000;
            border-radius: 50%;
            position: absolute;
        }

        .divider {
            width: 80%;
            height: 8px;
            border-radius: 5px;
            background: #000;
        }
    </style>
</head>

<body>

    <div class="tile">
        <div class="half">
            <!-- 6 -->
            <div class="pip" style="top:10%; left:20%;"></div>
            <div class="pip" style="top:10%; right:20%;"></div>
            <div class="pip" style="top:40%; left:20%;"></div>
            <div class="pip" style="top:40%; right:20%;"></div>
            <div class="pip" style="bottom:10%; left:20%;"></div>
            <div class="pip" style="bottom:10%; right:20%;"></div>
        </div>
        <div class="divider"></div>
        <div class="half">
            <!-- 6 -->
            <div class="pip" style="top:10%; left:20%;"></div>
            <div class="pip" style="top:10%; right:20%;"></div>
            <div class="pip" style="top:40%; left:20%;"></div>
            <div class="pip" style="top:40%; right:20%;"></div>
            <div class="pip" style="bottom:10%; left:20%;"></div>
            <div class="pip" style="bottom:10%; right:20%;"></div>
        </div>
    </div>

    <div class="tile">
        <div class="half">
            <!-- 5 -->
            <div class="pip" style="top:10%; left:20%;"></div>
            <div class="pip" style="top:10%; right:20%;"></div>
            <div class="pip" style="top:40%; left:50%; transform:translateX(-50%);"></div>
            <div class="pip" style="bottom:10%; left:20%;"></div>
            <div class="pip" style="bottom:10%; right:20%;"></div>
        </div>
        <div class="divider"></div>
        <div class="half">
            <!-- 1 -->
            <div class="pip" style="top:50%; left:50%; transform:translate(-50%,-50%);"></div>
        </div>
    </div>

    <div class="tile">
        <div class="half">
            <!-- 3 -->
            <div class="pip" style="top:10%; left:20%;"></div>
            <div class="pip" style="top:50%; left:50%; transform:translate(-50%,-50%);"></div>
            <div class="pip" style="bottom:10%; right:20%;"></div>
        </div>
        <div class="divider"></div>
        <div class="half">
            <!-- 4 -->
            <div class="pip" style="top:10%; left:20%;"></div>
            <div class="pip" style="top:10%; right:20%;"></div>
            <div class="pip" style="bottom:10%; left:20%;"></div>
            <div class="pip" style="bottom:10%; right:20%;"></div>
        </div>
    </div>

    <div class="tile">
        <div class="half">
            <!-- 0 -->
        </div>
        <div class="divider"></div>
        <div class="half">
            <!-- 2 -->
            <div class="pip" style="top:10%; left:20%;"></div>
            <div class="pip" style="bottom:10%; right:20%;"></div>
        </div>
    </div>

</body>

</html>
