<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buscar - Aroma Selecto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="container header">
    <div class="logo"><img src="images/logo.png" alt="Logo"><div class="site-title">Aroma Selecto</div></div>
    <nav class="nav"><a class="link-ghost" href="index.html">Inicio</a></nav>
  </header>

  <main class="container">
    <h1>Búsqueda</h1>
    <form action="#" class="card" style="padding:14px 18px">
      <label for="q">Buscar</label>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="q" class="input" type="search" placeholder="Escribe aquí tu búsqueda...">
        <button class="btn">Buscar</button>
      </div>
    </form>

    <section style="margin-top:18px">
      <h2>Resultados</h2>
      <p style="color:var(--muted)">Mostrando un ejemplo de resultado y artículos relacionados.</p>
      <div class="results">
        <article class="card">
          <h3 style="margin-top:0">Producto ejemplo</h3>
          <p style="color:var(--muted)">Descripción breve del producto o persona encontrada.</p>
          <a class="link-ghost" href="product.html">Ver ficha</a>
        </article>
        <aside class="card">
          <h4 style="margin-top:0">Artículos relacionados</h4>
          <ul style="color:var(--muted)">
            <li><a href="#">Nuestro menú</a></li>
            <li><a href="#">Promociones del día</a></li>
          </ul>
        </aside>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <div><small>Aroma Selecto — Todos los derechos reservados</small></div>
    <div><img class="copyright" src="images/copyright.png" alt="Copyright"></div>
  </footer>
</body>
</html>
